# Alembic Configuration for Health Triage Assistant Backend
# See /docs/DatabaseDesign.md — Section 5 Migration Workflow

[alembic]
# Path to migration scripts
script_location = alembic

# Template for new revision files
file_template = %%(rev)s_%%(slug)s

# Use async-aware migration (env.py handles asyncio.run())
prepend_sys_path = .

# Timezone for revision timestamps
timezone = UTC

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
